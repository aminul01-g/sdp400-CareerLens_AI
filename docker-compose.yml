# CareerLens AI — local development + offline demo stack.
#
# Phase 0 task T007. Provides the PostgreSQL 16 instance the whole system depends
# on, plus pgAdmin as the database GUI.
#
# This is also the offline demo fallback required by proposal section 6.4: the
# whole stack runs from this file with no external account, which matters when the
# deployed instance is unavailable on the day.
#
# Usage:
#   docker compose up -d                          # database + API
#   docker compose up -d postgres pgadmin api      # ...and the database GUI
#   docker compose run --rm api alembic upgrade head
#   docker compose run --rm api python -m scripts.seed_taxonomy
#   docker compose run --rm api python -m scripts.seed_job_roles
#   docker compose run --rm api python -m scripts.seed_admin
#   docker compose exec postgres psql -U careerlens -d careerlens -c '\conninfo'
#
# Migrations are a separate `run --rm` step rather than part of the API's start
# command. A bind-mounted source tree means every reload is a new container
# process, and a migration on every reload would run alembic dozens of times a
# minute. `alembic upgrade head` is idempotent, but paying for it on each reload
# would hide the failure mode where a migration is not.
#
# Connection string used by the API (see backend/.env.example):
#   postgresql+psycopg://careerlens:careerlens_dev_password@localhost:5432/careerlens
#
# NOTE ON ROOTLESS DOCKER
#   On hosts where the Docker daemon cannot be started as root (no sudo password),
#   run the daemon in rootless mode and point the CLI at it first, e.g.
#     export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/docker.sock
#   See docs/architecture.md "Environment reality" for the exact working recipe
#   used to develop this project on a rootless host.

name: careerlens

services:
  postgres:
    image: postgres:16
    container_name: careerlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: careerlens_dev_password
      POSTGRES_DB: careerlens
      # Deterministic collation so ORDER BY is stable across machines, which the
      # recommendation engine's determinism test depends on.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - careerlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens -d careerlens"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      - "-c"
      - "max_connections=200"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: careerlens-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careerlens.local
      PGADMIN_DEFAULT_PASSWORD: careerlens_dev_password
    ports:
      - "5050:80"
    volumes:
      - careerlens_pgadmin:/var/lib/pgadmin

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlens-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Points at the service name, not localhost: inside the compose network the
      # database is reachable by DNS, and localhost would mean this container.
      DATABASE_URL: postgresql+psycopg://careerlens:careerlens_dev_password@postgres:5432/careerlens
      TEST_DATABASE_URL: postgresql+psycopg://careerlens:careerlens_dev_password@postgres:5432/careerlens_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-careerlens_dev_only_secret_key_change_me_32chars}
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_ENABLED: "false"
      # The frontend dev server's origin. Empty would be the safe production
      # default, but this stack exists to be used locally, where blocking the
      # browser would just be annoying.
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      # Code and knowledge base are bind-mounted for hot reload. The named
      # dependency install is NOT mounted, so a host venv cannot shadow the
      # image's own site-packages.
      - ./backend/app:/srv/careerlens/app
      - ./backend/data:/srv/careerlens/data
      - ./backend/scripts:/srv/careerlens/scripts
      - careerlens_uploads:/srv/careerlens/uploads
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /srv/careerlens/app

volumes:
  careerlens_pgdata:
  careerlens_pgadmin:
  careerlens_uploads:
