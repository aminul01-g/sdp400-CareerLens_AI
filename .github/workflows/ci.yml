name: CI

# Every claim this project makes about itself — "702 tests, 0 failures",
# "92% statement coverage", "ruff and mypy clean", "38 browser tests" — is a
# claim about code that changes. A claim that is not checked is a claim that
# decays, and this repository had no CI at all until now: the numbers in
# README.md were true on the day they were written and nobody was there to
# notice when they stopped being.
#
# The gates below are the ones the documentation already claims. Each one is
# a command a developer can run locally, so a red build is never a mystery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — tests, lint, types
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Deterministic collation, matching docker-compose.yml. The search
          # tests depend on ILIKE rather than LIKE, and the same reasoning
          # applies here.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: careerlens_ci_password
          POSTGRES_DB: careerlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test suite with coverage
        env:
          DATABASE_URL: postgresql+psycopg://careerlens:careerlens_ci_password@localhost:5432/careerlens
          TEST_DATABASE_URL: postgresql+psycopg://careerlens:careerlens_ci_password@localhost:5432/careerlens_test
          JWT_SECRET_KEY: ci-secret-key-that-is-definitely-long-enough-123456
          ENVIRONMENT: test
        run: |
          python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: ruff check app tests scripts

      - name: Types
        run: mypy app

      - name: The repository's own compliance gate
        # 34 assertions about the things that must never regress: no legacy
        # Flask module, no tracked secret, no mock data, no predecessor
        # branding, and the ML layer's import purity.
        run: python ../scripts/verify_compliance.py

      - name: The generated documentation is current
        # docs/api.md and docs/erd.md are generated from the live system and
        # are supposed to be regenerated whenever a route or a column moves.
        # A test asserts that; this step reports the diff if it is stale.
        run: |
          python scripts/generate_api_docs.py
          git diff --exit-code -- ../docs/api.md \
            || (echo "::error::docs/api.md is stale — run python scripts/generate_api_docs.py" && exit 1)

      - name: Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        # The build is the only thing that proves the app compiles, and it is
        # also what the deployment does.
        run: npm run build

  browser:
    name: Browser — accessibility, keyboard, reflow, journey
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: careerlens_ci_password
          POSTGRES_DB: careerlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt
          npm ci

      - name: Migrate and seed the database
        env:
          DATABASE_URL: postgresql+psycopg://careerlens:careerlens_ci_password@localhost:5432/careerlens
          JWT_SECRET_KEY: ci-secret-key-that-is-definitely-long-enough-123456
          # The admin account the browser suite's admin spec signs in with.
          # A fixed, public password: this database exists for the length of
          # one CI run and is destroyed with the runner.
          ADMIN_EMAIL: admin@careerlens.dev
          ADMIN_PASSWORD: Adm-CiPassword2026
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed_taxonomy
          python -m scripts.seed_job_roles
          python -m scripts.seed_admin

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          E2E_ADMIN_EMAIL: admin@careerlens.dev
          E2E_ADMIN_PASSWORD: Adm-CiPassword2026
        run: |
          # The API the pages talk to. Started in the background and waited
          # for, because the frontend's webServer block only starts Next.
          cd ../backend
          (uvicorn app.main:app --host 127.0.0.1 --port 8000 &
           echo $! > /tmp/api.pid)
          cd ../frontend
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (echo "::error::the API did not start" && exit 1)
          npm run test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
